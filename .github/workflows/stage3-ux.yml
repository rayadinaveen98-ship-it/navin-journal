name: Stage 3 UX Chromium review

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/stage3-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        working-directory: prototype
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mocked DOM checks
        working-directory: prototype
        run: npm run check:smoke
      - name: Actual browser rendering and navigation checks
        working-directory: prototype
        run: npm run check:browser
      - name: Extended bilingual and large-text browser QA
        working-directory: prototype
        run: npm run check:extended
      - name: Keyboard and screen-reader-oriented focus checks
        working-directory: prototype
        run: npm run check:keyboard
      - name: Brand identity visual browser checks
        working-directory: prototype
        run: npm run check:brand
      - name: Approved mark in UI and adaptive mask browser review
        working-directory: prototype
        run: npm run check:approved-brand
      - name: Android staged icon XML and safe zone source checks
        working-directory: prototype
        run: python3 tests/icon_xml.py
      - name: Automated HTML accessibility scan
        working-directory: prototype
        run: npm run check:a11y
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-ux-screenshots
          path: prototype/artifacts/*
          retention-days: 7
          if-no-files-found: ignore
