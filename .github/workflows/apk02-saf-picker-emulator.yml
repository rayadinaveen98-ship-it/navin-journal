name: APK 02 Real Android DocumentsUI Fictional SAF Picker Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'preview_app/lib/apk02_saf_picker_main.dart'
      - 'preview_app/ci/apk02_android_saf_picker.sh'
      - 'spikes/flutter_bridge_probe/native/MainActivity.kt'
      - 'packages/journal_editor/**'
      - 'spikes/recovery_archive/**'
      - 'spikes/key_lifecycle/**'
      - '.github/workflows/apk02-saf-picker-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'preview_app/lib/apk02_saf_picker_main.dart'
      - 'preview_app/ci/apk02_android_saf_picker.sh'
      - 'spikes/flutter_bridge_probe/native/MainActivity.kt'
      - 'packages/journal_editor/**'
      - 'spikes/recovery_archive/**'
      - 'spikes/key_lifecycle/**'
      - '.github/workflows/apk02-saf-picker-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navin-apk02-actual-saf-picker
  cancel-in-progress: true

jobs:
  actual-saf-documentsui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate disposable Android SAF picker app and native debug-only bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TARGET="$ROOT/preview_app/_saf_picker_generated"
          flutter create --org com.navinjournal \
            --project-name navin_journal_saf_probe --platforms=android "$TARGET"
          cp "$ROOT/preview_app/lib/"*.dart "$TARGET/lib/"
          rm -f "$TARGET/test/widget_test.dart"
          NATIVE="$TARGET/android/app/src/main/kotlin"
          mkdir -p "$NATIVE/com/navinjournal/navin_journal_saf_probe"
          mkdir -p "$NATIVE/com/navinjournal/security/spike"
          cp "$ROOT/spikes/flutter_bridge_probe/native/MainActivity.kt" \
            "$NATIVE/com/navinjournal/navin_journal_saf_probe/MainActivity.kt"
          sed -i 's/package com.navinjournal.navin_journal_bridge_probe/package com.navinjournal.navin_journal_saf_probe/' \
            "$NATIVE/com/navinjournal/navin_journal_saf_probe/MainActivity.kt"
          cp "$ROOT/spikes/key_lifecycle/android/src/main/kotlin/com/navinjournal/security/spike/AndroidKeystoreKeyProtector.kt" \
            "$NATIVE/com/navinjournal/security/spike/"
          python3 - "$TARGET/pubspec.yaml" "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          path, root = Path(sys.argv[1]), Path(sys.argv[2])
          s = path.read_text()
          extra = (
            "  navin_journal_core:\n"
            f"    path: {root / 'packages/journal_core'}\n"
            "  navin_journal_editor:\n"
            f"    path: {root / 'packages/journal_editor'}\n"
            "  navin_journal_autosave_spike:\n"
            f"    path: {root / 'spikes/autosave_coordinator'}\n"
            "  navin_journal_encrypted_spike:\n"
            f"    path: {root / 'spikes/encrypted_store'}\n"
            "  navin_journal_bridge_probe:\n"
            f"    path: {root / 'spikes/flutter_bridge_probe'}\n"
            "  navin_journal_key_lifecycle_spike:\n"
            f"    path: {root / 'spikes/key_lifecycle'}\n"
            "  navin_journal_recovery_archive_spike:\n"
            f"    path: {root / 'spikes/recovery_archive'}\n"
          )
          s = s.replace("dependencies:\n", "dependencies:\n" + extra, 1)
          s += "\nhooks:\n  user_defines:\n    sqlite3:\n      source: sqlite3mc\n"
          path.write_text(s)
          PY
          # Confirm Android Auto Backup cannot silently repopulate a disposed
          # fixture instead of exercising only local scripted test content.
          python3 - "$TARGET/android/app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import sys
          manifest = Path(sys.argv[1])
          s = manifest.read_text()
          assert '<application' in s and 'android:allowBackup' not in s
          manifest.write_text(s.replace(
            '<application', '<application android:allowBackup="false"', 1))
          PY
          echo "SAF_PROBE_ROOT=$TARGET" >> "$GITHUB_ENV"
      - name: Resolve dependencies and strictly analyze all Flutter source
        shell: bash
        run: |
          cd "$SAF_PROBE_ROOT"
          flutter pub get
          dart format lib
          flutter analyze --no-pub
      - name: Verify encrypted editor worker and portable archive contracts
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/packages/journal_editor"
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded
      - name: Compile fictional Android SAF picker debug APK
        shell: bash
        run: |
          cd "$SAF_PROBE_ROOT"
          flutter build apk --debug -t lib/apk02_saf_picker_main.dart
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable emulator acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -c /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "::warning::No KVM hardware virtualization available"
          fi
      - name: Exercise actual Android DocumentsUI picker cancellations and authenticated roundtrip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save -memory 3072 -cores 2
          script: bash "$GITHUB_WORKSPACE/preview_app/ci/apk02_android_saf_picker.sh"
      - name: Retain ONLY disposable fictional SAF test APK after successful Android gate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk02-ACTUAL-SAF-PICKER-FICTIONAL-ONLY-NOT-BETA
          path: preview_app/_saf_picker_generated/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
