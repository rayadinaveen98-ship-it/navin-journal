name: Stage 4 A2.4 Flutter Keystore Bridge
on:
  push:
    branches: [main]
    paths:
      - 'spikes/flutter_bridge_probe/**'
      - 'spikes/key_lifecycle/lib/**'
      - 'spikes/key_lifecycle/android/src/main/**'
      - 'spikes/encrypted_store/**'
      - 'spikes/autosave_coordinator/**'
      - '.github/workflows/flutter-keystore-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android-bridge-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Flutter version
        run: flutter --version
      - name: Generate isolated Android harness and integrate repository sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TARGET="$GITHUB_WORKSPACE/spikes/_generated_bridge_probe"
          flutter create --org com.navinjournal --project-name navin_journal_bridge_probe --platforms=android "$TARGET"
          cp "$ROOT/spikes/flutter_bridge_probe/lib/"*.dart "$TARGET/lib/"
          rm -f "$TARGET/test/widget_test.dart"
          cp "$ROOT/spikes/flutter_bridge_probe/test/"*.dart "$TARGET/test/"
          mkdir -p "$TARGET/integration_test"
          cp "$ROOT/spikes/flutter_bridge_probe/integration_test/"*.dart "$TARGET/integration_test/"
          APP_NATIVE="$TARGET/android/app/src/main/kotlin"
          mkdir -p "$APP_NATIVE/com/navinjournal/navin_journal_bridge_probe"
          mkdir -p "$APP_NATIVE/com/navinjournal/security/spike"
          cp "$ROOT/spikes/flutter_bridge_probe/native/MainActivity.kt" "$APP_NATIVE/com/navinjournal/navin_journal_bridge_probe/MainActivity.kt"
          cp "$ROOT/spikes/key_lifecycle/android/src/main/kotlin/com/navinjournal/security/spike/AndroidKeystoreKeyProtector.kt" "$APP_NATIVE/com/navinjournal/security/spike/"
          python3 - "$TARGET/pubspec.yaml" "$ROOT" <<'PY'
          import sys
          from pathlib import Path
          target=Path(sys.argv[1])
          root=Path(sys.argv[2])
          s=target.read_text()
          s=s.replace("dependencies:\n",
              "dependencies:\n"
              "  navin_journal_key_lifecycle_spike:\n"
              f"    path: {root / 'spikes/key_lifecycle'}\n"
              "  navin_journal_encrypted_spike:\n"
              f"    path: {root / 'spikes/encrypted_store'}\n"
              "  navin_journal_autosave_spike:\n"
              f"    path: {root / 'spikes/autosave_coordinator'}\n", 1)
          s=s.replace("dev_dependencies:\n",
              "dev_dependencies:\n"
              "  integration_test:\n"
              "    sdk: flutter\n", 1)
          s += "\nhooks:\n  user_defines:\n    sqlite3:\n      source: sqlite3mc\n"
          target.write_text(s)
          PY
          echo "BRIDGE_PROBE_ROOT=$TARGET" >> "$GITHUB_ENV"
      - name: Resolve Dart and native SQLite3MC dependencies
        shell: bash
        run: |
          cd "$BRIDGE_PROBE_ROOT"
          flutter pub get
      - name: Format and static analysis
        shell: bash
        run: |
          cd "$BRIDGE_PROBE_ROOT"
          dart format lib test integration_test
          flutter analyze --no-pub
      - name: Flutter MethodChannel contract tests
        shell: bash
        run: |
          cd "$BRIDGE_PROBE_ROOT"
          flutter test test/android_key_bridge_test.dart --reporter expanded
      - name: Build Android debug-only bridge probe
        shell: bash
        run: |
          cd "$BRIDGE_PROBE_ROOT"
          flutter build apk --debug
      - name: Run Flutter-to-Kotlin-to-SQLite integration on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          script: bash "$GITHUB_WORKSPACE/spikes/flutter_bridge_probe/ci/run_android_integration.sh"
      - name: Upload debug engineering probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navin-stage4-a2-4-debug-probe-not-a-diary
          path: spikes/_generated_bridge_probe/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
