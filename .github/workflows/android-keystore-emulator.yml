name: Stage 4 A2.3 Android Keystore Emulator
on:
  push:
    branches: [main]
    paths:
      - 'spikes/key_lifecycle/android/**'
      - '.github/workflows/android-keystore-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-keystore-api35:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run AndroidKeyStore real-provider instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: gradle -p spikes/key_lifecycle/android connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-api35-test-reports
          path: |
            spikes/key_lifecycle/android/build/outputs/androidTest-results/
            spikes/key_lifecycle/android/build/reports/androidTests/
          if-no-files-found: ignore
