name: Stage 4 Android Keystore Adapter Compile
on:
  push:
    branches: [main]
    paths:
      - 'spikes/key_lifecycle/android/**'
      - '.github/workflows/android-keystore-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-keystore-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK platform from hosted runner
        run: |
          test -n "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "Android API 35 not preinstalled; installing with existing SDK manager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android Keystore Kotlin adapter (NOT device test)
        working-directory: spikes/key_lifecycle/android
        run: gradle compileDebugKotlin --no-daemon --stacktrace
