name: Stage 4 Android Keystore Adapter Compile
on:
  push:
    branches: [main]
    paths:
      - 'spikes/key_lifecycle/android/**'
      - '.github/workflows/android-keystore-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-keystore-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android Keystore Kotlin adapter (NOT device test)
        working-directory: spikes/key_lifecycle/android
        run: gradle compileDebugKotlin --no-daemon --stacktrace
