name: APK 02 Fictional Encrypted Library Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'preview_app/lib/**'
      - 'preview_app/test/**'
      - 'preview_app/apk02_test/**'
      - 'packages/journal_core/**'
      - 'packages/journal_editor/**'
      - 'spikes/flutter_bridge_probe/native/MainActivity.kt'
      - 'spikes/flutter_bridge_probe/lib/android_key_bridge.dart'
      - 'spikes/key_lifecycle/**'
      - '.github/workflows/apk02-library-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navin-apk02-fictional-library-debug
  cancel-in-progress: true

jobs:
  library-android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate disposable Android test app with native Keystore adapter
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TARGET="$ROOT/preview_app/_apk02_library"
          flutter create --org com.navinjournal \
            --project-name navin_journal_library_probe --platforms=android "$TARGET"
          cp "$ROOT/preview_app/lib/"*.dart "$TARGET/lib/"
          rm -f "$TARGET/test/widget_test.dart"
          cp "$ROOT/preview_app/test/"*.dart "$TARGET/test/"
          cp "$ROOT/preview_app/apk02_test/"*.dart "$TARGET/test/"
          # Test files import the preview package in other CI pipelines.
          # Rewrite imports for this separate Android application package.
          sed -i 's#package:navin_journal_preview/#package:navin_journal_library_probe/#g' "$TARGET/test/"*.dart
          NATIVE="$TARGET/android/app/src/main/kotlin"
          mkdir -p "$NATIVE/com/navinjournal/navin_journal_library_probe"
          mkdir -p "$NATIVE/com/navinjournal/security/spike"
          cp "$ROOT/spikes/flutter_bridge_probe/native/MainActivity.kt" \
            "$NATIVE/com/navinjournal/navin_journal_library_probe/MainActivity.kt"
          sed -i 's/package com.navinjournal.navin_journal_bridge_probe/package com.navinjournal.navin_journal_library_probe/' \
            "$NATIVE/com/navinjournal/navin_journal_library_probe/MainActivity.kt"
          cp "$ROOT/spikes/key_lifecycle/android/src/main/kotlin/com/navinjournal/security/spike/AndroidKeystoreKeyProtector.kt" \
            "$NATIVE/com/navinjournal/security/spike/"
          RES="$TARGET/android/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cp "$ROOT/prototype/brand/android/drawable/"*.xml "$RES/drawable/"
          cp "$ROOT/prototype/brand/android/mipmap-anydpi-v26/navin_journal_ic_launcher.xml" \
            "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          python3 - "$TARGET/pubspec.yaml" "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          path, root = Path(sys.argv[1]), Path(sys.argv[2])
          s = path.read_text()
          dependencies = (
            "  navin_journal_core:\n"
            f"    path: {root / 'packages/journal_core'}\n"
            "  navin_journal_editor:\n"
            f"    path: {root / 'packages/journal_editor'}\n"
            "  navin_journal_autosave_spike:\n"
            f"    path: {root / 'spikes/autosave_coordinator'}\n"
            "  navin_journal_bridge_probe:\n"
            f"    path: {root / 'spikes/flutter_bridge_probe'}\n"
            "  navin_journal_encrypted_spike:\n"
            f"    path: {root / 'spikes/encrypted_store'}\n"
            "  navin_journal_recovery_archive_spike:\n"
            f"    path: {root / 'spikes/recovery_archive'}\n"
            "  navin_journal_key_lifecycle_spike:\n"
            f"    path: {root / 'spikes/key_lifecycle'}\n"
          )
          s = s.replace("dependencies:\n", "dependencies:\n" + dependencies, 1)
          s += "\nhooks:\n  user_defines:\n    sqlite3:\n      source: sqlite3mc\n"
          path.write_text(s)
          PY
          echo "APK02_LIBRARY_ROOT=$TARGET" >> "$GITHUB_ENV"
      - name: Resolve native crypto and Flutter packages
        shell: bash
        run: |
          cd "$APK02_LIBRARY_ROOT"
          flutter pub get
          dart format lib test
      - name: Strict Flutter analysis
        shell: bash
        run: |
          cd "$APK02_LIBRARY_ROOT"
          flutter analyze --no-pub
      - name: Verify 23 encrypted journal/editor worker contract tests
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/packages/journal_editor"
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded
      - name: Verify stable Flutter visual and save-status widgets
        shell: bash
        run: |
          cd "$APK02_LIBRARY_ROOT"
          flutter test test/preview_widget_test.dart test/connected_writing_studio_test.dart --reporter expanded --concurrency=1 --timeout=90s
      - name: Full encrypted-worker Flutter navigation widget integration
        shell: bash
        run: |
          cd "$APK02_LIBRARY_ROOT"
          flutter test test/fictional_journal_library_test.dart --reporter expanded --concurrency=1 --timeout=40s
      - name: Verify all read-only encrypted recovery assessment verdicts
        shell: bash
        run: |
          cd "$APK02_LIBRARY_ROOT"
          flutter test test/recovery_assessment_review_test.dart --reporter expanded --concurrency=1 --timeout=45s
      - name: Compile standalone Android Library / Reader / Writer debug APK
        shell: bash
        run: |
          cd "$APK02_LIBRARY_ROOT"
          flutter build apk --debug -t lib/apk02_library_main.dart
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload debug-only fictional-data app (NOT PRIVATE DIARY)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navin-apk02-FICTIONAL-LIBRARY-NOT-PRIVATE-DIARY
          path: preview_app/_apk02_library/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
