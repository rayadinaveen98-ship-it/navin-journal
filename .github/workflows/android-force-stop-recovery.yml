name: Stage 4 A3.4 Android Force-Stop Recovery
on:
  push:
    branches: [main]
    paths:
      - 'spikes/flutter_bridge_probe/lib/crash_probe_main.dart'
      - 'spikes/flutter_bridge_probe/lib/android_key_bridge.dart'
      - 'spikes/flutter_bridge_probe/native/MainActivity.kt'
      - 'spikes/flutter_bridge_probe/ci/run_force_stop.sh'
      - 'spikes/key_lifecycle/lib/**'
      - 'spikes/key_lifecycle/android/src/main/**'
      - 'spikes/autosave_coordinator/lib/**'
      - 'spikes/encrypted_store/lib/**'
      - '.github/workflows/android-force-stop-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navin-journal-a3-4-android-force-stop
  cancel-in-progress: true

jobs:
  test-real-android-process-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate disposable Android harness with existing encrypted engine
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TARGET="$GITHUB_WORKSPACE/spikes/_generated_crash_probe"
          flutter create --org com.navinjournal --project-name navin_journal_bridge_probe --platforms=android "$TARGET"
          cp "$ROOT/spikes/flutter_bridge_probe/lib/"*.dart "$TARGET/lib/"
          rm -f "$TARGET/test/widget_test.dart"
          APP_NATIVE="$TARGET/android/app/src/main/kotlin"
          mkdir -p "$APP_NATIVE/com/navinjournal/navin_journal_bridge_probe"
          mkdir -p "$APP_NATIVE/com/navinjournal/security/spike"
          cp "$ROOT/spikes/flutter_bridge_probe/native/MainActivity.kt" "$APP_NATIVE/com/navinjournal/navin_journal_bridge_probe/MainActivity.kt"
          cp "$ROOT/spikes/key_lifecycle/android/src/main/kotlin/com/navinjournal/security/spike/AndroidKeystoreKeyProtector.kt" "$APP_NATIVE/com/navinjournal/security/spike/"
          python3 - "$TARGET/pubspec.yaml" "$ROOT" <<'PY'
          import sys
          from pathlib import Path
          path=Path(sys.argv[1])
          root=Path(sys.argv[2])
          s=path.read_text()
          s=s.replace("dependencies:\n",
              "dependencies:\n"
              "  navin_journal_key_lifecycle_spike:\n"
              f"    path: {root / 'spikes/key_lifecycle'}\n"
              "  navin_journal_encrypted_spike:\n"
              f"    path: {root / 'spikes/encrypted_store'}\n"
              "  navin_journal_autosave_spike:\n"
              f"    path: {root / 'spikes/autosave_coordinator'}\n", 1)
          s += "\nhooks:\n  user_defines:\n    sqlite3:\n      source: sqlite3mc\n"
          path.write_text(s)
          PY
          echo "BRIDGE_PROBE_ROOT=$TARGET" >> "$GITHUB_ENV"
      - name: Resolve native SQLite3MultipleCiphers and Flutter code
        shell: bash
        run: |
          cd "$BRIDGE_PROBE_ROOT"
          flutter pub get
          dart format lib
          flutter analyze --no-pub
      - name: Compile dedicated debug-only force-stop fixture
        shell: bash
        run: |
          cd "$BRIDGE_PROBE_ROOT"
          flutter build apk --debug -t lib/crash_probe_main.dart
      - name: Kill and reopen real Android processes across two committed versions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -no-snapshot-load -no-snapshot-save
          script: bash "$GITHUB_WORKSPACE/spikes/flutter_bridge_probe/ci/run_force_stop.sh"
      - name: Upload debug engineering fixture (not a diary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-a3-4-fictional-force-stop-fixture
          path: spikes/_generated_crash_probe/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
