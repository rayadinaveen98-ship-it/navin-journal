name: APK 02 Native Restore Publication and Durability Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/journal_core/**'
      - 'spikes/recovery_archive/**'
      - 'spikes/encrypted_store/**'
      - '.github/workflows/apk02-core-restore-durability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk02-native-restore-durability
  cancel-in-progress: true

jobs:
  native-noreplace-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve SQLite3MC and native FFI dependencies
        working-directory: packages/journal_core
        run: dart pub get
      - name: Strict Dart format and static analysis
        working-directory: packages/journal_core
        run: |
          dart format lib/native_restore_publisher.dart lib/restore_staging_inventory.dart lib/restore_staging_assessment.dart lib/staged_product_restore.dart test/staged_product_restore_test.dart test/restore_interruption_test.dart test/restore_staging_assessment_test.dart test/fixtures/restore_sigkill_child.dart
          dart analyze --fatal-infos
      - name: Test encrypted restore no-replace and native durability checkpoints
        working-directory: packages/journal_core
        run: dart test --reporter expanded
