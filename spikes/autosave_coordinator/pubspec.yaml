name: navin_journal_autosave_spike
description: Fictional-data-only autosave state machine and isolated encrypted SQLite commit proof.
publish_to: none
version: 0.0.1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  sqlite3: 3.9.1
  navin_journal_encrypted_spike:
    path: ../encrypted_store
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
