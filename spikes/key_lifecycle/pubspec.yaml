name: navin_journal_key_lifecycle_spike
description: Experimental test-only device key envelope and rewrap lifecycle. Not a native secure keystore.
publish_to: none
version: 0.0.1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  cryptography: 2.9.0
  navin_journal_encrypted_spike:
    path: ../encrypted_store
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
