;overflow:hidden;text-align:left;background:var(--paper);padding:0 0 16px}.memory-tile .thumb{width:100%;height:150px;border-radius:0}.memory-tile strong,.memory-tile small{display:block;margin:10px 14px 0}.calendar{background:var(--paper);padding:23px;border:1px solid var(--line);border-radius:20px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.days span,.days button{text-align:center;min-height:40px;display:grid;place-items:center;border-radius:10px}.days button{border:0;background:var(--bg)}.days button.highlight{background:var(--green);color:var(--on)}.search{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-size:16px}.notice{background:var(--muted);border:1px solid var(--line);padding:15px 18px;border-radius:13px;font-size:13px;color:var(--sub);line-height:1.6;margin:18px 0}.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting strong{display:block;margin-bottom:5px}.setting small{display:block}.welcome{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1fr 1fr;max-width:1200px;margin:auto;align-items:stretch}.welcome-art{position:relative;min-height:680px;background:linear-gradient(180deg,#E9D9C6,#EFCDA8 40%,#7B8E77 60%,#465B48);overflow:hidden}.welcome-art:before{content:"";position:absolute;left:-20%;right:-20%;bottom:-6%;height:45%;background:#425A46;transform:rotate(-14deg);border-radius:80% 80% 0 0}.welcome-art:after{content:"";position:absolute;top:20%;left:42%;height:95px;width:95px;background:#F8E6BF;border-radius:100%;box-shadow:0 0 85px #F9DEAB}.welcome-content{padding:70px clamp(30px,5vw,85px);display:flex;flex-direction:column;justify-content:center}.welcome h1{font-size:clamp(46px,5.5vw,70px);line-height:1.04}.welcome p{color:var(--sub);font-family:Georgia,serif;font-size:20px}.welcome .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.welcome .small{margin-top:30px}.dialog-cover{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;display:grid;place-items:center;padding:18px}.dialog{background:var(--paper);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:26px;box-shadow:0 30px 65px rgba(0,0,0,.25)}.dialog h2{font-size:28px}.dialog p{color:var(--sub)}.mobile-nav{display:none}

html{font-size:calc(16px * var(--type-scale,1))}

<script>
(function(){
const sample=[
{id:0,title:'An ordinary evening worth remembering',date:'12 Nov 2026',journal:'Personal',kind:'sunset',text:'It wasn’t a special day by any measure, yet it feels important. After a long week, I finally took a slow walk in the evening. The air was cool, the sky painted in those soft shades of orange, and for a while, everything felt calm.\n\nI realised how much I’ve been craving simplicity — not big changes, just more moments like this. A little quiet, a little space, and the reminder that life can be beautiful even when it’s ordinary.'},
{id:1,title:'The trip I’ll always remember',date:'10 Nov 2026',journal:'Travel',kind:'sunset',text:'The hills, the clouds, and the kind of silence you don’t get in the city. I felt like a small reset — the kind that stays with you.\n\nSome journeys become memories before they have even ended.'},
{id:2,title:'A late night thought',date:'9 Nov 2026',journal:'Reflections',kind:'night',text:'Some thoughts are clearer in the quiet of the night. I wanted to remember this one, without explaining it to anyone else.'},
{id:3,title:'Small things, big feelings',date:'6 Nov 2026',journal:'Personal',kind:'rose',text:'A cup of tea, a familiar song, and a good conversation. There was nothing dramatic, but I felt thankful for all of it.'}
];
const tabs=[['today','home','Today'],['journals','book','Journals'],['memories','calendar','Memories'],['discover','search','Discover']];
let s={view:'welcome',theme:'light',selected:0,journal:'Personal',activeJournal:'Personal',editorReturn:'today',typeScale:1,demoVault:'unlocked',demoBackup:'none',memory:'timeline',search:'',draftTitle:'',draft:'',returnView:'today'};
let dialog=null;let dialogReturnAction=null;

const iconPaths={
 home:'M3 10.5 12 3l9 7.5V21h-7v-7h-4v7H3z',

 search:'M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 5 5',

 photo:'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm-1 14 5-5 3 3 3-4 5 6M9 9v.1',

function ico(n){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(iconPaths[n]||iconPaths.more)+'"/></svg>'}

const el=document.getElementById('app');
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=k=>'<div class="thumb '+esc(k)+'" aria-hidden="true"></div>';
const btn=(label,act,klass='')=>'<button class="btn '+klass+'" data-action="'+act+'">'+label+'</button>';
function nav(){return tabs.map(t=>'<button data-view="'+t[0]+'" class="'+(s.view===t[0]?'active':'')+'"><span class="glyph" aria-hidden="true">'+ico(t[1])+'</span><span>'+t[2]+'</span></button>').join('')}
function shell(content,title){return '<div class="shell"><aside class="sidebar"><div class="brand">Navin Journal<small>Your life in words</small></div><nav aria-label="Main navigation" class="nav">'+nav()+'</nav><div class="side-footer"><button class="side-action" data-view="settings">'+ico('settings')+' Settings</button><button class="side-action" data-action="write">'+ico('pen')+' Write an entry</button></div></aside><main class="workspace"><header class="topbar"><span class="eyebrow">'+esc(title)+'</span><div class="top-right"><button class="icon-button" data-action="theme" aria-label="Toggle light and dark theme" title="Toggle theme">'+ico(s.theme==='light'?'moon':'sun')+'</button><button class="icon-button" data-view="settings" aria-label="Settings">'+ico('more')+'</button></div></header><div class="page">'+content+'</div></main><nav aria-label="Mobile navigation" class="mobile-nav">'+nav()+'</nav></div>'}
function list(a){return '<div class="entries">'+a.map(e=>'<button class="entry" data-entry="'+e.id+'">'+thumb(e.kind)+'<span class="entry-copy"><span class="pill">'+esc(e.journal)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.text.slice(0,90))+'…</p><span class="entry-date">'+esc(e.date)+'</span></span><span aria-hidden="true">›</span></button>').join('')+'</div>'}
function welcome(){return '<div class="welcome"><div class="welcome-art" aria-hidden="true"></div><div class="welcome-content"><span class="eyebrow">A private place for your story</span><h1>Write.<br>Remember.<br>Return.</h1><p>A calm space for your thoughts, memories, and life’s little stories.</p><div class="buttons">'+btn('Begin the preview →','start','primary')+btn('View dark theme','theme')+'</div><p class="small">Concept preview only. No sign-in, encryption, backups, or real journal storage are implemented.</p></div></div>'}
function today(){return shell('<section class="hero"><span class="eyebrow">13 November 2026 · Sample date</span><h1>Your pages, your pace.</h1><p>A little space to pause, reflect, and write.</p>'+btn(ico('pen')+' Write an entry','write','primary')+'</section><div class="section-head"><h2>Recent entries</h2><button class="link-btn" data-view="journals">All journals →</button></div>'+list(sample.slice(0,3))+'<div class="section-head"><h2>Return to a memory</h2><button class="link-btn" data-view="memories">Explore →</button></div><button class="entry" data-entry="1">'+thumb('sunset')+'<span class="entry-copy"><span class="pill">From your journal</span><h3>The trip I’ll always remember</h3><p>Revisit a thought from an earlier day.</p></span></button>','Today')}
function journals(){let names=[['Personal','38 entries'],['Travel','12 entries'],['Reflections','21 entries'],['Ideas','9 entries']];return shell('<div class="section-head"><h2>Your journals</h2>'+btn('＋ New journal','newJournal')+'</div><div class="layout-cards">'+names.map((x,i)=>'<button class="book-card" data-journal="'+x[0]+'"><div class="book-cover">'+['P','T','R','I'][i]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+' · Sample collection</p></button>').join('')+'</div><div class="notice">Each journal is a separate collection. In the real app, you’ll be able to customize covers, move entries, archive journals, and restore items from Trash.</div>','Journals')}
function journalDetail(){let a=sample.filter(e=>e.journal===s.journal);return shell('<button class="link-btn" data-view="journals">‹ All journals</button><section class="hero"><span class="eyebrow">Your collection</span><h1>'+esc(s.journal)+'</h1><p>Memories and reflections gathered in one place.</p>'+btn(ico('pen')+' Write here','write','primary')+'</section>'+(a.length?list(a):'<div class="notice">No sample entries in this journal yet. Add an entry once full journaling functionality exists.</div>'),'Journals / '+s.journal)}
function writer(){return shell('<div class="editor-wrap"><div class="editor-head"><button data-action="closeEditor">‹ Close</button><label class="small journal-picker" for="journalSelect">Journal <select id="journalSelect" aria-label="Choose the journal for this preview draft">'+['Personal','Travel','Reflections','Ideas'].map(j=>'<option value="'+j+'" '+(s.activeJournal===j?'selected':'')+'>'+j+'</option>').join('')+'</select></label><span class="small">13 Nov 2026</span><span class="small" role="status">Demo draft · Not saved</span></div><div class="editor-meta">YOUR PAGE · No prompt required</div><textarea id="draftTitle" rows="1" class="title-input" placeholder="Title (optional)" aria-label="Entry title">'+esc(s.draftTitle)+'</textarea><textarea class="journal-area" id="draftBody" aria-label="Journal entry content" placeholder="What’s on your mind today?">'+esc(s.draft)+'</textarea><div class="editor-tools"><div class="tools"><button class="mini-btn" data-action="media" title="Insert concept">'+ico('plus')+'</button><button class="mini-btn" data-action="media" title="Photo concept">'+ico('photo')+'</button><button class="mini-btn" data-action="media" title="Voice concept">'+ico('mic')+'</button><button class="mini-btn" data-action="format" title="Formatting concept">Aa</button></div></div></div>','Writing Studio')}
function reader(){const e=sample[s.selected]||sample[0];const peers=sample.map(x=>'<button class="entry'+(x.id===s.selected?' selected-entry':'')+'" data-entry="'+x.id+'"><span class="entry-copy"><span class="pill">'+esc(x.journal)+'</span><h3>'+esc(x.title)+'</h3><span class="entry-date">'+esc(x.date)+'</span></span></button>').join('');return shell('<div class="reader-layout"><aside class="reader-siblings" aria-label="Other sample entries"><span class="eyebrow">Other memories</span><div class="entries">'+peers+'</div></aside><div class="reader"><button class="link-btn" data-action="goBack">‹ Back</button><div class="landscape read-hero" role="img" aria-label="Stylized landscape illustration"></div><div class="byline">'+esc(e.journal.toUpperCase())+' · Written '+esc(e.date)+'</div><h1>'+esc(e.title)+'</h1><div class="copy">'+esc(e.text)+'</div><div class="section-head">'+btn(ico('pen')+' Edit sample','edit')+btn('More options','readActions')+'</div></div></div>','Journal Reader')}
function memories(){const picker='<div class="tab-row">'+['timeline','calendar','gallery'].map(x=>'<button class="'+(s.memory===x?'sel':'')+'" data-memory="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div>';let body='';
if(s.memory==='timeline')body='<div class="section-head"><h2>2026</h2><span class="small">Illustrative timeline</span></div>'+list(sample);
else if(s.memory==='gallery')body='<div class="memory-grid">'+sample.map(e=>'<button class="memory-tile" data-entry="'+e.id+'">'+thumb(e.kind)+'<strong>'+esc(e.title)+'</strong><small>'+esc(e.date)+'</small></button>').join('')+'</div>';
else body='<div class="calendar"><h2>November 2026</h2><div class="days">'+['S','M','T','W','T','F','S'].map(d=>'<span class="small">'+d+'</span>').join('')+Array.from({length:35},(_,i)=>{let d=i-0;return d<1||d>30?'<span></span>':'<button class="'+([6,9,10,12].includes(d)?'highlight':'')+'" data-action="calendar" data-day="'+d+'">'+d+'</button>'}).join('')+'</div><div class="notice">Select a highlighted day to open a sample entry.</div></div>';
return shell('<section class="hero"><span class="eyebrow">Your personal archive</span><h1>Memories</h1><p>Different ways to return to your story.</p></section>'+picker+body,'Memories')}
function discover(){return shell('<section class="hero"><span class="eyebrow">Find your story</span><h1>Discover</h1><p>Find an entry by thought, title, or memory.</p></section><label for="journalSearch" class="small">Search sample entries</label><input class="search" id="journalSearch" placeholder="Search your sample journal…" value="'+esc(s.search)+'" autocomplete="off"><div class="tab-row"><button class="sel">All journals</button><button data-action="filters">Date filters</button><button data-action="filters">Tags</button><button data-action="filters">Media</button></div><div id="searchResults">'+list(sample)+'</div><div class="notice">The final app will search local encrypted journal data after unlock. This preview filters only four public sample entries.</div>','Discover')}
function settings(){return shell('<div class="section-head"><h2>Settings & privacy</h2></div><div class="setting"><div><strong>Appearance</strong><small>Same layout in light and dark mode</small></div>'+btn(s.theme==='light'?'Use dark':'Use light','theme')+'</div><div class="setting"><div><strong>Reading & writing size</strong><small>Preview how your journal reflows at larger text sizes</small></div><div class="size-controls"><button class="mini-btn" data-action="typeDown" aria-label="Decrease text size">A−</button><output aria-label="Text scale">'+Math.round(s.typeScale*100)+'%</output><button class="mini-btn" data-action="typeUp" aria-label="Increase text size">A+</button></div></div><div class="setting"><div><strong>Private vault</strong><small>App lock and recovery-key setup</small></div>'+btn('Preview','privacy')+'</div><div class="setting"><div><strong>Backup & restore</strong><small>Verify an encrypted archive before restoring</small></div>'+btn('Preview','backup')+'</div><div class="setting"><div><strong>Trash & archived journals</strong><small>Restore before permanently deleting</small></div>'+btn('Open','trash')+'</div><div class="setting"><div><strong>Language & accessibility</strong><small>System text size, Telugu input, reduced motion</small></div>'+btn('View notes','accessibility')+'</div><div class="notice">This Stage 3 document explores how settings will work. No encryption, synchronization, database, backup, or deletion operations occur in the preview.</div>','Settings')}

function setup(){return '<div class="welcome"><div class="welcome-art" aria-hidden="true"></div><div class="welcome-content"><span class="eyebrow">FIRST-JOURNAL SETUP · SAMPLE</span><h1>Your first journal.</h1><p>A private place to begin. No sign-in is required in our planned experience.</p><div class="notice"><strong>My Journal</strong><br>Simple, personal, and ready for writing. App lock and encrypted backup will be configurable in the actual product. No secure vault is created in this preview.</div><div class="buttons">'+btn('Continue to preview →','createVault','primary')+btn('‹ Back','backWelcome')+'</div></div></div>'}
function backupScreen(){const states=[['none','Not created','There is no real backup in this demo.'],['created','Created, not verified','An archive can exist but still be impossible to restore.'],['verified','Verified · demo state','This is what a successful verification state could look like, not a test result.'],['failed','Verification failed · demo state','An unverified backup must not alter the current journal.']];const cur=states.find(x=>x[0]===s.demoBackup);return shell('<button class="link-btn" data-view="settings">‹ Settings</button><section class="hero"><span class="eyebrow">RECOVERY EXPERIENCE · DESIGN ONLY</span><h1>Backup & restore</h1><p>Know what is safe before changing devices.</p></section><div class="notice"><strong>'+esc(cur[1])+'</strong><br>'+esc(cur[2])+'</div><div class="tab-row">'+states.map(x=>'<button class="'+(x[0]===s.demoBackup?'sel':'')+'" data-backup-state="'+x[0]+'">'+esc(x[1])+'</button>').join('')+'</div><div class="section-head"><h2>Restore sequence</h2></div><div class="notice">Select encrypted archive → enter recovery key → inspect journal and media counts → verify integrity → stage the restore → confirm before applying. When verification fails, the current journal must remain unchanged.</div>'+btn('Preview rejected restore','restoreFail')+'<p class="small">Simulation: this screen neither creates files nor reads backups.</p>','Backup & restore')}
function privacyScreen(){return shell('<button class="link-btn" data-view="settings">‹ Settings</button><section class="hero"><span class="eyebrow">SECURITY EXPERIENCE · DESIGN ONLY</span><h1>Privacy & app lock</h1><p>Journal content should remain confidential, with a clear and realistic recovery model.</p></section><div class="setting"><div><strong>Example lock state</strong><small>'+(s.demoVault==='locked'?'Locked appearance selected; real protection is not active.':'Unlocked appearance; sample content is not private.')+'</small></div>'+btn(s.demoVault==='locked'?'Show unlocked state':'Show locked state','toggleVault')+'</div><div class="notice">No encryption, authentication, biometric security or real data protection is present in this HTML preview. Production testing must include titles, thumbnails, search indexes, notifications and app-switcher snapshots.</div>','Privacy & app lock')}

function trash(){return shell('<button class="link-btn" data-view="settings">‹ Settings</button><section class="hero"><h1>Trash</h1><p>Deleted entries can be restored here before permanent removal.</p></section><div class="notice">There are no deleted sample items. In the real app, this page will show deletion date, exact number of items, Restore and Permanent delete actions, with clear backup-retention warnings.</div>','Trash')}
function paintResults(){const node=document.getElementById('searchResults');if(node){let q=s.search.trim().toLowerCase();let a=sample.filter(e=>(e.title+' '+e.text+' '+e.journal).toLowerCase().includes(q));node.innerHTML=a.length?list(a):'<div class="notice">No entries matched this search. Try a different word.</div>'}}
function draw(){document.body.setAttribute('data-theme',s.theme);document.body.setAttribute('data-view',s.view);document.body.setAttribute('data-type-scale',String(s.typeScale));document.documentElement?.style?.setProperty('--type-scale',String(s.typeScale));let v=s.view;el.innerHTML= v==='welcome'?welcome():v==='setup'?setup():v==='backup'?backupScreen():v==='privacy'?privacyScreen():v==='today'?today():v==='journals'?journals():v==='journalDetail'?journalDetail():v==='writer'?writer():v==='reader'?reader():v==='memories'?memories():v==='discover'?discover():v==='trash'?trash():settings();if(dialog){let d=dialog;el.insertAdjacentHTML('beforeend','<div class="dialog-cover" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">'+esc(d.title)+'</h2><p>'+esc(d.text)+'</p>'+`<button id="dialogDismiss" class="btn primary" data-action="dismiss">Got it</button>`+'</section></div>')};if(v==='discover')paintResults();if(v==='writer'){const title=document.getElementById('draftTitle');if(title?.style){title.style.height='auto';title.style.height=Math.max(56,title.scrollHeight)+'px'}const area=document.getElementById('draftBody');if(area&&area.style){area.style.height='auto';area.style.height=Math.max(320,area.scrollHeight)+'px'}}}
function info(title,text){dialogReturnAction=document.activeElement?.dataset?.action||null;dialog={title,text};draw();document.getElementById('dialogDismiss')?.focus()}
function dismissDialog(){dialog=null;draw();if(dialogReturnAction){const target=document.querySelector?.('[data-action="'+dialogReturnAction+'"]');target?.focus?.();dialogReturnAction=null}}
el.addEventListener('click',function(ev){let b=ev.target.closest('button');if(!b)return;
if(b.dataset.view){s.view=b.dataset.view;dialog=null;draw();return}
if(b.dataset.entry!==undefined){s.selected=Number(b.dataset.entry);if(s.view!=='reader')s.returnView=s.view;s.view='reader';draw();return}
if(b.dataset.journal){s.journal=b.dataset.journal;s.view='journalDetail';draw();return}
if(b.dataset.memory){s.memory=b.dataset.memory;draw();return}if(b.dataset.backupState){s.demoBackup=b.dataset.backupState;draw();return}
let a=b.dataset.action;
if(a==='start'){s.view='setup';draw()}if(a==='createVault'){s.view='today';draw()}if(a==='backWelcome'){s.view='welcome';draw()}
if(a==='typeUp'||a==='typeDown'){const sizes=[1,1.25,1.5,2];const ix=sizes.indexOf(s.typeScale);s.typeScale=sizes[Math.max(0,Math.min(sizes.length-1,ix+(a==='typeUp'?1:-1)))];draw()}
if(a==='theme'){const active=document.activeElement;const focusId=active&&(active.id==='draftBody'||active.id==='draftTitle')?active.id:(s.view==='writer'?'draftBody':null);const previousField=focusId?document.getElementById(focusId):null;const begin=previousField?previousField.selectionStart:null;const end=previousField?previousField.selectionEnd:null;const offset=typeof window!=='undefined'?window.scrollY:null;s.theme=s.theme==='light'?'dark':'light';draw();if(focusId){const field=document.getElementById(focusId);if(field){field.focus();if(begin!==null&&end!==null&&typeof field.setSelectionRange==='function')field.setSelectionRange(begin,end)}}if(offset!==null&&typeof window!=='undefined')window.scrollTo(0,offset)}
if(a==='write'){s.editorReturn=s.view;s.activeJournal=s.view==='journalDetail'?s.journal:'Personal';s.view='writer';draw();document.getElementById('draftBody')?.focus()}
if(a==='closeEditor'){s.view=s.editorReturn||'today';draw()}
if(a==='goBack'){s.view=s.returnView||'today';draw()}
if(a==='edit'){s.editorReturn='reader';s.draftTitle=sample[s.selected].title;s.draft=sample[s.selected].text;s.activeJournal=sample[s.selected].journal;s.view='writer';draw();document.getElementById('draftBody')?.focus()}
if(a==='dismiss'){dismissDialog()}
if(a==='calendar'){let day=Number(b.dataset.day);s.selected=day===12?0:day===10?1:day===9?2:3;s.returnView='memories';s.view='reader';draw()}
if(a==='backup'){s.view='backup';draw()}if(a==='restoreFail')info('Restore rejected — simulation','This archive cannot be verified. Your current journal should remain unchanged. No files were read or modified in this preview.');
if(a==='privacy'){s.view='privacy';draw()}if(a==='toggleVault'){s.demoVault=s.demoVault==='locked'?'unlocked':'locked';draw()}
if(a==='filters'||a==='media'||a==='format'||a==='newJournal'||a==='readActions')info('Interaction specification','This control is mapped in the full UX specification. The Stage 3 preview demonstrates navigation and appearance only; it does not execute production actions.');
if(a==='accessibility')info('Accessibility requirements','Text reflow, screen reader semantics, Telugu-English input, 48dp touch targets, clear contrast and reduced motion are mandatory validation tasks.');
});
el.addEventListener('change',function(e){if(e.target.id==='journalSelect')s.activeJournal=e.target.value});
el.addEventListener('input',function(e){if(e.target.id==='draftTitle'){s.draftTitle=e.target.value;if(e.target.style){e.target.style.height='auto';e.target.style.height=Math.max(56,e.target.scrollHeight)+'px'}}if(e.target.id==='draftBody'){s.draft=e.target.value;if(e.target.style){e.target.style.height='auto';e.target.style.height=Math.max(320,e.target.scrollHeight)+'px'}}if(e.target.id==='journalSearch'){s.search=e.target.value;paintResults()}});
document.addEventListener('keydown',function(e){if(dialog&&e.key==='Escape'){e.preventDefault();dismissDialog();return}if(dialog&&e.key==='Tab'){e.preventDefault();document.getElementById('dialogDismiss')?.focus();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();s.view='discover';draw();document.getElementById('journalSearch')?.focus()}});
draw();
})();
</script>
</body>
</html>
