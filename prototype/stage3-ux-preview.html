<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Navin Journal · Stage 3 UX Review</title>
<style>
:root{--bg:#F8F5EE;--paper:#FFFCF7;--muted:#EFE8DE;--ink:#282923;--sub:#56594F;--green:#475A43;--on:#F8F5EE;--clay:#A45E42;--line:#DAD6CB;--shade:0 16px 46px rgba(53,47,38,.08)}
[data-theme=dark]{--bg:#15191C;--paper:#1D2226;--muted:#272D31;--ink:#F1EDE4;--sub:#B9C0B9;--green:#AEBF9B;--on:#15191C;--clay:#D9A289;--line:#3B4142;--shade:0 16px 46px rgba(0,0,0,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--clay);outline-offset:3px}
h1,h2,h3,p{margin-top:0}h1,h2,h3,.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:500;letter-spacing:-.025em}p{line-height:1.62}small,.small{font-size:12px;color:var(--sub)}a{color:var(--green)}button{color:inherit}#app{min-height:100vh}
.demo-banner{position:sticky;top:0;z-index:30;background:var(--green);color:var(--on);text-align:center;padding:8px 16px;font-size:12px;font-weight:600;letter-spacing:.01em}
.shell{display:flex;min-height:calc(100vh - 34px)}.sidebar{width:230px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);padding:30px 16px;display:flex;flex-direction:column;gap:24px}.brand{font:500 25px Georgia,serif;letter-spacing:-1px;padding-left:12px}.brand small{display:block;font:500 10px system-ui;letter-spacing:3px;text-transform:uppercase;color:var(--sub);margin-top:3px}.nav{display:grid;gap:6px}.nav button,.side-action{background:transparent;border:0;border-radius:13px;padding:13px 12px;text-align:left;display:flex;gap:12px;align-items:center;min-height:48px}.nav button.active{background:var(--muted);color:var(--green);font-weight:700}.glyph{font-size:18px;width:24px;text-align:center}.side-footer{margin-top:auto;display:grid;gap:4px}.workspace{flex:1;min-width:0;padding:30px max(26px,calc((100vw - 1050px)/2));padding-bottom:105px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:31px;gap:12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--sub)}.topbar .eyebrow{font-size:12px}.top-right{display:flex;gap:9px}.icon-button{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font-size:19px}.page{max-width:820px;margin:0 auto}.hero{padding:27px 0 32px}.hero h1{font-size:clamp(36px,4.2vw,54px);line-height:1.12;margin:11px 0}.hero p{font-family:Georgia,serif;font-size:17px;color:var(--sub);margin:0 0 27px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:13px 19px;font-weight:650;min-height:48px}.btn.primary{background:var(--green);color:var(--on);border-color:var(--green)}.btn.ghost{border:0;background:transparent}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:30px 0 15px}.section-head h2{font-size:26px;margin:0}.link-btn{border:none;background:none;color:var(--green);font-weight:700}.entries{display:grid;gap:12px}.entry{width:100%;display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:var(--paper);padding:14px;border-radius:18px;text-align:left;box-shadow:var(--shade)}.thumb{width:95px;height:85px;flex:none;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(#E6C69E 0%,#DA9F73 45%,#788E7A 46%,#425746 100%)}.thumb::before,.landscape::before{content:"";position:absolute;border-radius:50%;background:#F9E5B7;box-shadow:0 0 25px #f4cb9b;top:14%;right:23%;width:27px;height:27px}.thumb::after,.landscape::after{content:"";position:absolute;left:-20%;bottom:-16%;width:135%;height:46%;border-radius:50% 50% 0 0;background:#374C41;transform:rotate(-8deg)}.thumb.rose{background:linear-gradient(135deg,#DAB9AA,#B37D75 55%,#657A67)}.thumb.rose::after{background:#566A5A}.thumb.night{background:linear-gradient(#2A3848,#4E5E6A 60%,#25333F)}.thumb.night::before{background:#E4E2CA;box-shadow:0 0 18px #C4D1D1}.entry-copy{flex:1;min-width:0}.entry h3{font:500 21px Georgia,serif;margin:4px 0 6px}.entry p{margin:0;color:var(--sub);font-size:13px;line-height:1.5}.pill{font-size:10px;letter-spacing:.08em;font-weight:750;color:var(--green);text-transform:uppercase}.entry-date{font-size:12px;color:var(--sub);margin-top:6px}
.layout-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.book-card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:20px;text-align:left;min-height:206px}.book-cover{width:56px;height:76px;border-radius:5px 9px 9px 5px;box-shadow:inset 7px 0 rgba(0,0,0,.11),0 7px 15px rgba(0,0,0,.09);margin-bottom:15px;background:linear-gradient(135deg,#9D8067,#574B3C);display:grid;place-items:center;color:#F9ECD5;font:24px Georgia,serif}.book-card:nth-child(2) .book-cover{background:linear-gradient(135deg,#8CA0A0,#44616C)}.book-card:nth-child(3) .book-cover{background:linear-gradient(135deg,#B19A80,#A86955)}.book-card:nth-child(4) .book-cover{background:linear-gradient(135deg,#979B7D,#58644C)}.book-card h3{font-size:24px;margin:0 0 6px}.book-card p{margin:0;color:var(--sub);font-size:13px}
.editor-wrap{max-width:730px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px clamp(18px,4vw,56px) 22px;min-height:72vh;box-shadow:var(--shade)}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.editor-head button{border:0;background:none}.editor-meta{color:var(--sub);font-size:12px;margin:25px 0}.title-input{font:500 34px Georgia,serif;color:var(--ink);background:transparent;border:0;width:100%;outline:0;line-height:1.25}.title-input::placeholder{color:var(--sub)}.journal-area{width:100%;min-height:340px;resize:vertical;line-height:1.72;font:18px Georgia,serif;border:0;outline:0;background:transparent;color:var(--ink);padding:18px 0}.journal-area::placeholder{color:var(--sub)}.editor-tools{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:18px}.tools{display:flex;gap:6px}.mini-btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-width:41px}.read-hero{height:205px;border-radius:17px;margin-bottom:28px}.landscape{position:relative;overflow:hidden;background:linear-gradient(#E9CEB0,#DB9C73 45%,#788E7A 46%,#465C48)}.reader{max-width:700px;margin:0 auto;background:var(--paper);border:1px solid var(--line);padding:clamp(22px,5vw,56px);border-radius:20px;box-shadow:var(--shade)}.reader h1{font-size:clamp(31px,4vw,42px);line-height:1.18}.reader .copy{font:19px/1.8 Georgia,serif;white-space:pre-line}.reader .byline{font-size:12px;color:var(--sub);margin-bottom:24px}.tab-row{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tab-row button{background:var(--paper);border:1px solid var(--line);padding:10px 14px;border-radius:999px}.tab-row button.sel{background:var(--green);color:var(--on);border-color:var(--green)}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.memory-tile{border:0;border-radius:16px;overflow:hidden;text-align:left;background:var(--paper);padding:0 0 16px}.memory-tile .thumb{width:100%;height:150px;border-radius:0}.memory-tile strong,.memory-tile small{display:block;margin:10px 14px 0}.calendar{background:var(--paper);padding:23px;border:1px solid var(--line);border-radius:20px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.days span,.days button{text-align:center;min-height:40px;display:grid;place-items:center;border-radius:10px}.days button{border:0;background:var(--bg)}.days button.highlight{background:var(--green);color:var(--on)}.search{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-size:16px}.notice{background:var(--muted);border:1px solid var(--line);padding:15px 18px;border-radius:13px;font-size:13px;color:var(--sub);line-height:1.6;margin:18px 0}.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting strong{display:block;margin-bottom:5px}.setting small{display:block}.welcome{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1fr 1fr;max-width:1200px;margin:auto;align-items:stretch}.welcome-art{position:relative;min-height:680px;background:linear-gradient(180deg,#E9D9C6,#EFCDA8 40%,#7B8E77 60%,#465B48);overflow:hidden}.welcome-art:before{content:"";position:absolute;left:-20%;right:-20%;bottom:-6%;height:45%;background:#425A46;transform:rotate(-14deg);border-radius:80% 80% 0 0}.welcome-art:after{content:"";position:absolute;top:20%;left:42%;height:95px;width:95px;background:#F8E6BF;border-radius:100%;box-shadow:0 0 85px #F9DEAB}.welcome-content{padding:70px clamp(30px,5vw,85px);display:flex;flex-direction:column;justify-content:center}.welcome h1{font-size:clamp(46px,5.5vw,70px);line-height:1.04}.welcome p{color:var(--sub);font-family:Georgia,serif;font-size:20px}.welcome .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.welcome .small{margin-top:30px}.dialog-cover{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;display:grid;place-items:center;padding:18px}.dialog{background:var(--paper);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:26px;box-shadow:0 30px 65px rgba(0,0,0,.25)}.dialog h2{font-size:28px}.dialog p{color:var(--sub)}.mobile-nav{display:none}
@media(max-width:760px){.sidebar{display:none}.workspace{padding:16px 18px 102px}.topbar{margin-bottom:14px}.page{width:100%}.hero{padding:18px 0 8px}.hero h1{font-size:38px}.layout-cards{grid-template-columns:1fr 1fr}.book-card{padding:15px;min-height:186px}.entry .thumb{width:72px;height:73px}.entry h3{font-size:18px}.memory-grid{grid-template-columns:repeat(2,1fr)}.memory-tile .thumb{height:130px}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:1px solid var(--line);position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px 5px max(8px,env(safe-area-inset-bottom))}.mobile-nav button{background:none;border:0;border-radius:11px;min-height:48px;display:grid;place-items:center;gap:2px;font-size:11px;color:var(--sub)}.mobile-nav button.active{color:var(--green);font-weight:800;background:var(--muted)}.mobile-nav .glyph{font-size:19px}.editor-wrap{border:0;box-shadow:none;padding:13px 6px;background:transparent;min-height:70vh}.reader{border:0;box-shadow:none;border-radius:0;padding:19px 4px;background:transparent}.reader .copy{font-size:18px}.read-hero{height:190px}.welcome{grid-template-columns:1fr;min-height:calc(100vh - 34px)}.welcome-art{min-height:180px}.welcome-art:after{width:55px;height:55px}.welcome-content{padding:36px 26px}.welcome h1{font-size:42px}.welcome p{font-size:18px}}
@media(max-width:370px){.entry{gap:10px;padding:10px}.entry .thumb{width:64px;height:64px}.entry h3{font-size:16px}.layout-cards{grid-template-columns:1fr}.memory-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:no-preference){.btn,.entry,.book-card,.icon-button,.tab-row button{transition:transform .15s ease,background .2s ease}.btn:active,.entry:active,.book-card:active{transform:scale(.987)}}
</style>
</head>
<body data-theme="light">
<div class="demo-banner">STAGE 3 UX PREVIEW — Sample content only · Not a working diary · Nothing is saved to disk</div>
<div id="app"></div>
<script>
(function(){
const sample=[
{id:0,title:'An ordinary evening worth remembering',date:'12 Nov 2026',journal:'Personal',kind:'sunset',text:'It wasn’t a special day by any measure, yet it feels important. After a long week, I finally took a slow walk in the evening. The air was cool, the sky painted in those soft shades of orange, and for a while, everything felt calm.\n\nI realised how much I’ve been craving simplicity — not big changes, just more moments like this. A little quiet, a little space, and the reminder that life can be beautiful even when it’s ordinary.'},
{id:1,title:'The trip I’ll always remember',date:'10 Nov 2026',journal:'Travel',kind:'sunset',text:'The hills, the clouds, and the kind of silence you don’t get in the city. I felt like a small reset — the kind that stays with you.\n\nSome journeys become memories before they have even ended.'},
{id:2,title:'A late night thought',date:'9 Nov 2026',journal:'Reflections',kind:'night',text:'Some thoughts are clearer in the quiet of the night. I wanted to remember this one, without explaining it to anyone else.'},
{id:3,title:'Small things, big feelings',date:'6 Nov 2026',journal:'Personal',kind:'rose',text:'A cup of tea, a familiar song, and a good conversation. There was nothing dramatic, but I felt thankful for all of it.'}
];
const tabs=[['today','⌂','Today'],['journals','▤','Journals'],['memories','▦','Memories'],['discover','⌕','Discover']];
let s={view:'welcome',theme:'light',selected:0,journal:'Personal',activeJournal:'Personal',memory:'timeline',search:'',draftTitle:'',draft:'',returnView:'today'};
let dialog=null;
const el=document.getElementById('app');
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=k=>'<div class="thumb '+esc(k)+'" aria-hidden="true"></div>';
const btn=(label,act,klass='')=>'<button class="btn '+klass+'" data-action="'+act+'">'+label+'</button>';
function nav(){return tabs.map(t=>'<button data-view="'+t[0]+'" class="'+(s.view===t[0]?'active':'')+'"><span class="glyph" aria-hidden="true">'+t[1]+'</span><span>'+t[2]+'</span></button>').join('')}
function shell(content,title){return '<div class="shell"><aside class="sidebar"><div class="brand">Navin Journal<small>Your life in words</small></div><nav aria-label="Main navigation" class="nav">'+nav()+'</nav><div class="side-footer"><button class="side-action" data-view="settings">⚙ &nbsp; Settings</button><button class="side-action" data-action="write">✎ &nbsp; Write an entry</button></div></aside><main class="workspace"><header class="topbar"><span class="eyebrow">'+esc(title)+'</span><div class="top-right"><button class="icon-button" data-action="theme" aria-label="Toggle light and dark theme" title="Toggle theme">'+(s.theme==='light'?'☾':'☀')+'</button><button class="icon-button" data-view="settings" aria-label="Settings">⋯</button></div></header><div class="page">'+content+'</div></main><nav aria-label="Mobile navigation" class="mobile-nav">'+nav()+'</nav></div>'}
function list(a){return '<div class="entries">'+a.map(e=>'<button class="entry" data-entry="'+e.id+'">'+thumb(e.kind)+'<span class="entry-copy"><span class="pill">'+esc(e.journal)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.text.slice(0,90))+'…</p><span class="entry-date">'+esc(e.date)+'</span></span><span aria-hidden="true">›</span></button>').join('')+'</div>'}
function welcome(){return '<div class="welcome"><div class="welcome-art" aria-hidden="true"></div><div class="welcome-content"><span class="eyebrow">A private place for your story</span><h1>Write.<br>Remember.<br>Return.</h1><p>A calm space for your thoughts, memories, and life’s little stories.</p><div class="buttons">'+btn('Begin the preview →','start','primary')+btn('View dark theme','theme')+'</div><p class="small">Concept preview only. No sign-in, encryption, backups, or real journal storage are implemented.</p></div></div>'}
function today(){return shell('<section class="hero"><span class="eyebrow">Friday, 13 November 2026 · Example date</span><h1>Your pages, your pace.</h1><p>A little space to pause, reflect, and write.</p>'+btn('✎ &nbsp; Write an entry','write','primary')+'</section><div class="section-head"><h2>Recent entries</h2><button class="link-btn" data-view="journals">All journals →</button></div>'+list(sample.slice(0,3))+'<div class="section-head"><h2>Return to a memory</h2><button class="link-btn" data-view="memories">Explore →</button></div><button class="entry" data-entry="1">'+thumb('sunset')+'<span class="entry-copy"><span class="pill">From your journal</span><h3>The trip I’ll always remember</h3><p>Revisit a thought from an earlier day.</p></span></button>','Today')}
function journals(){let names=[['Personal','38 entries'],['Travel','12 entries'],['Reflections','21 entries'],['Ideas','9 entries']];return shell('<div class="section-head"><h2>Your journals</h2>'+btn('＋ New journal','newJournal')+'</div><div class="layout-cards">'+names.map((x,i)=>'<button class="book-card" data-journal="'+x[0]+'"><div class="book-cover">'+['P','T','R','I'][i]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+' · Sample collection</p></button>').join('')+'</div><div class="notice">Each journal is a separate collection. In the real app, you’ll be able to customize covers, move entries, archive journals, and restore items from Trash.</div>','Journals')}
function journalDetail(){let a=sample.filter(e=>e.journal===s.journal);return shell('<button class="link-btn" data-view="journals">‹ All journals</button><section class="hero"><span class="eyebrow">Your collection</span><h1>'+esc(s.journal)+'</h1><p>Memories and reflections gathered in one place.</p>'+btn('✎ Write here','write','primary')+'</section>'+(a.length?list(a):'<div class="notice">No sample entries in this journal yet. Add an entry once full journaling functionality exists.</div>'),'Journals / '+s.journal)}
function writer(){return shell('<div class="editor-wrap"><div class="editor-head"><button data-action="closeEditor">‹ Close</button><span class="small">'+esc(s.activeJournal)+' · 13 Nov 2026</span><span class="small" role="status">Demo draft · Not saved</span></div><div class="editor-meta">YOUR PAGE · No prompt required</div><input id="draftTitle" class="title-input" placeholder="Title (optional)" aria-label="Entry title" value="'+esc(s.draftTitle)+'"><textarea class="journal-area" id="draftBody" aria-label="Journal entry content" placeholder="What’s on your mind today?">'+esc(s.draft)+'</textarea><div class="editor-tools"><div class="tools"><button class="mini-btn" data-action="media" title="Insert photo concept">＋</button><button class="mini-btn" data-action="media" title="Photo concept">▧</button><button class="mini-btn" data-action="media" title="Voice concept">♬</button><button class="mini-btn" data-action="format" title="Formatting concept">Aa</button></div>'+btn('Close preview','closeEditor')+'</div></div>','Writing Studio')}
function reader(){const e=sample[s.selected]||sample[0];return shell('<div class="reader"><button class="link-btn" data-action="goBack">‹ Back</button><div class="landscape read-hero" role="img" aria-label="Stylized landscape placeholder"></div><div class="byline">'+esc(e.journal.toUpperCase())+' · Written '+esc(e.date)+'</div><h1>'+esc(e.title)+'</h1><div class="copy">'+esc(e.text)+'</div><div class="section-head">'+btn('✎ Edit concept','edit')+btn('More options','readActions')+'</div></div>','Journal Reader')}
function memories(){const picker='<div class="tab-row">'+['timeline','calendar','gallery'].map(x=>'<button class="'+(s.memory===x?'sel':'')+'" data-memory="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div>';let body='';
if(s.memory==='timeline')body='<div class="section-head"><h2>2026</h2><span class="small">Illustrative timeline</span></div>'+list(sample);
else if(s.memory==='gallery')body='<div class="memory-grid">'+sample.map(e=>'<button class="memory-tile" data-entry="'+e.id+'">'+thumb(e.kind)+'<strong>'+esc(e.title)+'</strong><small>'+esc(e.date)+'</small></button>').join('')+'</div>';
else body='<div class="calendar"><h2>November 2026</h2><div class="days">'+['S','M','T','W','T','F','S'].map(d=>'<span class="small">'+d+'</span>').join('')+Array.from({length:35},(_,i)=>{let d=i-0;return d<1||d>30?'<span></span>':'<button class="'+([6,9,10,12].includes(d)?'highlight':'')+'" data-action="calendar" data-day="'+d+'">'+d+'</button>'}).join('')+'</div><div class="notice">Select a highlighted day to open a sample entry.</div></div>';
return shell('<section class="hero"><span class="eyebrow">Your personal archive</span><h1>Memories</h1><p>Different ways to return to your story.</p></section>'+picker+body,'Memories')}
function discover(){return shell('<section class="hero"><span class="eyebrow">Find your story</span><h1>Discover</h1><p>Find an entry by thought, title, or memory.</p></section><label for="journalSearch" class="small">Search sample entries</label><input class="search" id="journalSearch" placeholder="Search your sample journal…" value="'+esc(s.search)+'" autocomplete="off"><div class="tab-row"><button class="sel">All journals</button><button data-action="filters">Date filters</button><button data-action="filters">Tags</button><button data-action="filters">Media</button></div><div id="searchResults">'+list(sample)+'</div><div class="notice">The final app will search local encrypted journal data after unlock. This preview filters only four public sample entries.</div>','Discover')}
function settings(){return shell('<div class="section-head"><h2>Settings & privacy</h2></div><div class="setting"><div><strong>Appearance</strong><small>Same layout in light and dark mode</small></div>'+btn(s.theme==='light'?'Use dark':'Use light','theme')+'</div><div class="setting"><div><strong>Private vault</strong><small>App lock and recovery-key setup</small></div>'+btn('Preview','privacy')+'</div><div class="setting"><div><strong>Backup & restore</strong><small>Verify an encrypted archive before restoring</small></div>'+btn('Preview','backup')+'</div><div class="setting"><div><strong>Trash & archived journals</strong><small>Restore before permanently deleting</small></div>'+btn('Open','trash')+'</div><div class="setting"><div><strong>Language & accessibility</strong><small>System text size, Telugu input, reduced motion</small></div>'+btn('View notes','accessibility')+'</div><div class="notice">This Stage 3 document explores how settings will work. No encryption, synchronization, database, backup, or deletion operations occur in the preview.</div>','Settings')}
function trash(){return shell('<button class="link-btn" data-view="settings">‹ Settings</button><section class="hero"><h1>Trash</h1><p>Deleted entries can be restored here before permanent removal.</p></section><div class="notice">There are no deleted sample items. In the real app, this page will show deletion date, exact number of items, Restore and Permanent delete actions, with clear backup-retention warnings.</div>','Trash')}
function paintResults(){const node=document.getElementById('searchResults');if(node){let q=s.search.trim().toLowerCase();let a=sample.filter(e=>(e.title+' '+e.text+' '+e.journal).toLowerCase().includes(q));node.innerHTML=a.length?list(a):'<div class="notice">No entries matched this search. Try a different word.</div>'}}
function draw(){document.body.setAttribute('data-theme',s.theme);let v=s.view;el.innerHTML= v==='welcome'?welcome():v==='today'?today():v==='journals'?journals():v==='journalDetail'?journalDetail():v==='writer'?writer():v==='reader'?reader():v==='memories'?memories():v==='discover'?discover():v==='trash'?trash():settings();if(dialog){let d=dialog;el.insertAdjacentHTML('beforeend','<div class="dialog-cover" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">'+esc(d.title)+'</h2><p>'+esc(d.text)+'</p>'+btn('Got it','dismiss','primary')+'</section></div>')};if(v==='discover')paintResults()}
function info(title,text){dialog={title,text};draw()}
el.addEventListener('click',function(ev){let b=ev.target.closest('button');if(!b)return;
if(b.dataset.view){s.view=b.dataset.view;dialog=null;draw();return}
if(b.dataset.entry!==undefined){s.selected=Number(b.dataset.entry);s.returnView=s.view;s.view='reader';draw();return}
if(b.dataset.journal){s.journal=b.dataset.journal;s.view='journalDetail';draw();return}
if(b.dataset.memory){s.memory=b.dataset.memory;draw();return}
let a=b.dataset.action;
if(a==='start'){s.view='today';draw()}
if(a==='theme'){s.theme=s.theme==='light'?'dark':'light';draw()}
if(a==='write'){s.activeJournal=s.view==='journalDetail'?s.journal:'Personal';s.view='writer';draw();document.getElementById('draftBody')?.focus()}
if(a==='closeEditor'){s.view='today';draw()}
if(a==='goBack'){s.view=s.returnView||'today';draw()}
if(a==='edit'){s.draftTitle=sample[s.selected].title;s.draft=sample[s.selected].text;s.activeJournal=sample[s.selected].journal;s.view='writer';draw();document.getElementById('draftBody')?.focus()}
if(a==='dismiss'){dialog=null;draw()}
if(a==='calendar'){let day=Number(b.dataset.day);s.selected=day===12?0:day===10?1:day===9?2:3;s.returnView='memories';s.view='reader';draw()}
if(a==='backup')info('Backup & restore — planned','The real flow will create an encrypted archive, verify its integrity, preview journal and media counts, and restore without changing existing data if verification fails. This preview does none of those operations.');
if(a==='privacy')info('Privacy — planned','The real app will use an encrypted local vault and optional app lock with documented recovery. This preview contains only sample public text and is not an encrypted diary.');
if(a==='filters'||a==='media'||a==='format'||a==='newJournal'||a==='readActions')info('Interaction specification','This control is mapped in the full UX specification. The Stage 3 preview demonstrates navigation and appearance only; it does not execute production actions.');
if(a==='accessibility')info('Accessibility requirements','Text reflow, screen reader semantics, Telugu-English input, 48dp touch targets, clear contrast and reduced motion are mandatory validation tasks.');
});
el.addEventListener('input',function(e){if(e.target.id==='draftTitle')s.draftTitle=e.target.value;if(e.target.id==='draftBody')s.draft=e.target.value;if(e.target.id==='journalSearch'){s.search=e.target.value;paintResults()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dialog){dialog=null;draw()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();s.view='discover';draw();document.getElementById('journalSearch')?.focus()}});
draw();
})();
</script>
</body>
</html>
