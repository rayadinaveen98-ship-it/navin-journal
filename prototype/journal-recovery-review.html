<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Navin Journal · Recovery UX Preview</title>
<style>
:root{--bg:#F8F5EE;--paper:#FFFCF7;--muted:#EFE8DE;--ink:#282923;--sub:#56594F;--pine:#475A43;--on:#F8F5EE;--line:#DAD6CB;--clay:#A45E42;--danger:#A53835}
[data-theme=dark]{--bg:#15191C;--paper:#1D2226;--muted:#272D31;--ink:#F1EDE4;--sub:#B9C0B9;--pine:#AEBF9B;--on:#15191C;--line:#3B4142;--clay:#D9A289;--danger:#FFADA6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--clay);outline-offset:3px}
h1,h2,h3{font-family:Georgia,serif;line-height:1.15;font-weight:500;letter-spacing:-.025em}h1{font-size:clamp(34px,5vw,48px);margin:10px 0 18px}h2{font-size:27px}h3{font-size:22px}p{line-height:1.65;color:var(--sub)}.small{font-size:13px}.eyebrow{color:var(--sub);font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
.demo{background:var(--pine);color:var(--on);padding:10px 16px;text-align:center;font-weight:650;font-size:13px}.skip{position:absolute;top:7px;left:12px;z-index:10;background:var(--paper);padding:11px;transform:translateY(-160%)}.skip:focus{transform:translateY(0)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1150px;min-height:calc(100vh - 42px);margin:auto}.side{background:var(--paper);border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:10px;font:500 22px Georgia,serif}.brand img{width:42px;height:42px}.brand small{display:block;font:600 10px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}.nav{display:grid;gap:5px}.nav button{padding:12px 14px;border:0;background:transparent;border-radius:12px;min-height:48px;text-align:left}.nav button.active{background:var(--muted);font-weight:750;color:var(--pine)}.side a{margin-top:auto;color:var(--pine);font-size:13px}
.main{padding:28px 30px 85px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}.top button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 14px;min-height:48px}.content{max-width:800px;margin:auto}.lead{font:17px/1.65 Georgia,serif;color:var(--sub)}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:11px 16px;font-weight:650}.btn.primary{background:var(--pine);color:var(--on);border-color:var(--pine)}.btn.danger{color:var(--danger);border-color:var(--danger)}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:20px 0}.back{border:0;background:none;color:var(--pine);font-weight:750;min-height:48px;padding:9px 0}.card{padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:18px;min-width:0}.card h2,.card h3{margin:7px 0}.card p{font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:25px 0}.book{width:54px;height:73px;border-radius:4px 9px 9px 4px;background:linear-gradient(120deg,#97A38A,#475A43);box-shadow:inset 8px 0 rgba(0,0,0,.14);display:grid;place-items:center;color:#fff;font:25px Georgia,serif}.card:nth-child(even) .book{background:linear-gradient(120deg,#C2A18D,#815D4D)}.list{display:grid;gap:11px}.item{display:flex;gap:15px;align-items:center;justify-content:space-between;padding:19px;background:var(--paper);border:1px solid var(--line);border-radius:15px}.item .item-text{flex:1;min-width:0}.item h3{overflow-wrap:anywhere;margin:6px 0}.item p{font-size:13px;margin:0}.empty{padding:28px;border:1px dashed var(--line);border-radius:17px;background:var(--paper);color:var(--sub);text-align:center}.soft{background:var(--muted);padding:17px 19px;border:1px solid var(--line);border-radius:14px;color:var(--sub);font-size:13px;line-height:1.7;margin:18px 0}.soft strong{color:var(--ink)}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:var(--muted);padding:14px;border-radius:12px;min-width:105px;font-size:12px;color:var(--sub)}.stat strong{font-size:23px;color:var(--ink);display:block}
.reader{padding:clamp(22px,5vw,50px);border:1px solid var(--line);background:var(--paper);border-radius:18px}.reader .body{white-space:pre-wrap;font:19px/1.8 Georgia,serif;overflow-wrap:break-word}
.field{display:grid;gap:7px;margin:22px 0}.field input{padding:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:100%}.error{color:var(--danger);font-size:13px}.error[hidden]{display:none}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:99;display:grid;place-items:center;padding:18px}.modal{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 24px 90px rgba(0,0,0,.25)}.modal h2{margin:12px 0}.modal .actions{justify-content:flex-end;margin-bottom:0}
.mobile{display:none}
@media(max-width:780px){.shell{display:block}.side{display:none}.main{padding:17px 17px 112px}.mobile{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:fixed;z-index:50;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 5px max(8px,env(safe-area-inset-bottom))}.mobile button{min-height:51px;border:0;background:none;border-radius:10px;font-size:12px}.mobile button.active{background:var(--muted);font-weight:750;color:var(--pine)}}@media(max-width:450px){.grid{grid-template-columns:1fr}.item{flex-direction:column;align-items:stretch}.modal{padding:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body data-theme="light"><a class="skip" href="#main">Skip to main content</a><div class="demo">STAGE 3 DEMO · Fictional data · Changes disappear on reload · No encrypted storage</div><div id="root"></div>
<script>
(()=>{
const root=document.getElementById('root');
const journals=[{id:'j1',name:'Personal',archived:false},{id:'j2',name:'Travel',archived:false},{id:'j3',name:'Reflections',archived:false}];
const entries=[{id:'e1',jid:'j1',title:'An ordinary evening worth remembering',body:'The sun was setting when I stepped outside. I wanted to keep this quiet moment.',date:'12 Nov 2026',trashed:false},{id:'e2',jid:'j2',title:'The trip I’ll always remember',body:'The hills, the clouds and the silence of a different place.',date:'10 Nov 2026',trashed:false},{id:'e3',jid:'j3',title:'A late night thought',body:'Some things feel clearer when the world is quiet.',date:'9 Nov 2026',trashed:false}];
const trash=[];
let route='journals',dark=false,selectedJournal='j1',selectedEntry='e1',nextJ=4,backup='none',dialog=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,variant='')=>'<button class="btn '+variant+'" type="button" data-action="'+action+'">'+label+'</button>';
const journal=id=>journals.find(j=>j.id===id);
const count=id=>entries.filter(e=>e.jid===id&&!e.trashed).length;
const jName=id=>journal(id)?.name||'Deleted journal';
const activeTab=()=>['journal','create','rename','reader','archives'].includes(route)?'journals':route;
function nav(){return [['journals','Journals'],['trash','Trash'],['backup','Backup review']].map(([id,label])=>'<button type="button" data-route="'+id+'" class="'+(activeTab()===id?'active':'')+'" '+(activeTab()===id?'aria-current="page"':'')+'>'+label+'</button>').join('')}
function wrap(content,title){return '<div class="shell"><aside class="side"><div class="brand"><img src="brand/folded-page-'+(dark?'dark':'approved')+'.svg" alt=""><span>Navin Journal<small>Design simulation</small></span></div><nav aria-label="Recovery demo" class="nav">'+nav()+'</nav><a href="stage3-ux-preview.html">Back to full UX preview</a></aside><main id="main" tabindex="-1" class="main"><div class="top"><span class="eyebrow">'+esc(title)+'</span>'+btn(dark?'Light theme':'Dark theme','theme')+'</div><div class="content">'+content+'</div></main><nav aria-label="Mobile recovery demo" class="mobile">'+nav()+'</nav></div>'}
function journalsPage(){return wrap('<div class="eyebrow">Your personal collection</div><h1>Your journals</h1><p class="lead">Separate books for the different parts of life.</p><div class="actions">'+btn('＋ Create journal','create','primary')+btn('Archived journals','archives')+'</div><div class="grid">'+journals.filter(j=>!j.archived).map(j=>'<article class="card"><div class="book" aria-hidden="true">'+esc(j.name.charAt(0).toUpperCase())+'</div><h3>'+esc(j.name)+'</h3><p>'+count(j.id)+' sample '+(count(j.id)===1?'entry':'entries')+'</p>'+btn('Open journal','open:'+j.id)+'</article>').join('')+'</div>'+(journals.some(j=>!j.archived)?'':'<div class="empty">No active journals</div>')+'<div class="soft"><strong>Demo only:</strong> all changes exist in temporary browser memory. Reloading resets the sample library.</div>','Journal library')}
function detailPage(){const j=journal(selectedJournal);if(!j)return journalsPage();const es=entries.filter(e=>e.jid===j.id&&!e.trashed);return wrap('<button class="back" data-route="journals">‹ Journals</button><h1>'+esc(j.name)+'</h1><div class="stats"><div class="stat"><strong>'+es.length+'</strong>example entries</div><div class="stat"><strong>'+(j.archived?'Archived':'Active')+'</strong>journal status</div></div><div class="actions">'+btn('Rename','rename')+btn(j.archived?'Unarchive':'Archive','archive')+btn('Move journal to Trash','deleteJournal','danger')+'</div><h2>Entries</h2><div class="list">'+es.map(e=>'<article class="item"><div class="item-text"><span class="eyebrow">'+esc(e.date)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.body)+'</p></div>'+btn('Read','read:'+e.id)+'</article>').join('')+'</div>'+(es.length?'':'<div class="empty">No sample entries in this journal</div>')+'<div class="soft">In the real app, these relationships must survive offline use and complete backup/restore. This is only a UI review.</div>','Journal detail')}
function formPage(){const rename=route==='rename';const j=journal(selectedJournal);return wrap('<button class="back" data-route="'+(rename?'journal':'journals')+'">‹ Cancel</button><h1>'+(rename?'Rename journal':'Create a journal')+'</h1><p class="lead">Give this collection a name. Covers and individual privacy settings are specified separately.</p><form id="journalForm" novalidate><div class="field"><label for="journalName">Journal name</label><input id="journalName" maxlength="48" value="'+(rename?esc(j?.name):'')+'" placeholder="For example: My travels" required><span id="nameError" class="error" role="alert" hidden></span></div><div class="actions"><button type="submit" class="btn primary">'+(rename?'Save name':'Create demo journal')+'</button>'+btn('Cancel','cancel')+'</div></form><div class="soft">This is not a permanent journal. Changes are cleared on reload.</div>','Journal form')}
function readerPage(){const e=entries.find(e=>e.id===selectedEntry&&!e.trashed);if(!e)return detailPage();return wrap('<button class="back" data-route="journal">‹ '+esc(jName(e.jid))+'</button><article class="reader"><span class="eyebrow">'+esc(e.date)+' · '+esc(jName(e.jid))+'</span><h1>'+esc(e.title)+'</h1><div class="body">'+esc(e.body)+'</div><div class="actions">'+btn('Move entry to Trash','deleteEntry','danger')+'</div></article><div class="soft">Fictional entry. The production reader will handle real revisions, media and accessibility settings.</div>','Reader')}
function archivesPage(){const js=journals.filter(j=>j.archived);return wrap('<button class="back" data-route="journals">‹ Journals</button><h1>Archived journals</h1><p class="lead">Archive is not deletion: entries stay in their journal.</p><div class="list">'+js.map(j=>'<article class="item"><div class="item-text"><h3>'+esc(j.name)+'</h3><p>'+count(j.id)+' example entries</p></div>'+btn('Open','open:'+j.id)+'</article>').join('')+'</div>'+(js.length?'':'<div class="empty">Nothing archived yet</div>'),'Archive')}
function trashPage(){return wrap('<h1>Trash</h1><p class="lead">Recoverable entries and journals appear here until permanently deleted.</p><div class="stats"><div class="stat"><strong>'+trash.length+'</strong>recoverable items</div><div class="stat"><strong>'+trash.filter(t=>t.kind==='journal').length+'</strong>journals</div><div class="stat"><strong>'+trash.filter(t=>t.kind==='entry').length+'</strong>entries</div></div><div class="list" style="margin:20px 0">'+trash.map(t=>'<article class="item"><div class="item-text"><span class="eyebrow">'+(t.kind==='entry'?'ENTRY':'JOURNAL')+' · Trash demo</span><h3>'+esc(t.name)+'</h3><p>'+(t.kind==='journal'?t.eids.length+' entries contained':'From '+esc(jName(t.jid)))+'</p></div><div class="actions">'+btn('Restore','restore:'+t.id)+btn('Delete permanently','purge:'+t.id,'danger')+'</div></article>').join('')+'</div>'+(trash.length?'':'<div class="empty"><h2>Nothing in Trash</h2><p>Delete a fictional entry or journal to try the recovery journey.</p>'+btn('Open Journals','journals','primary')+'</div>')+'<div class="soft">Deleting here only changes temporary sample data. Real backups may retain copies even after permanent local deletion. Reload resets this entire preview.</div>','Trash')}
function backupPage(){const summary={journals:journals.length,entries:entries.filter(e=>!e.trashed).length,trash:trash.length};return wrap('<div class="eyebrow">Data recovery</div><h1>Backup and restore</h1><p class="lead">Saved locally, backed up and verified are three different states. No files or keys are handled by this demo.</p><div class="soft" role="status"><strong>Simulated state: '+({none:'Not backed up',invalid:'Verification failed',verified:'Verification passed (example only)'})[backup]+'</strong><p>No actual archive exists and nothing has been restored.</p></div><div class="stats"><div class="stat"><strong>'+summary.journals+'</strong>journals</div><div class="stat"><strong>'+summary.entries+'</strong>entries</div><div class="stat"><strong>'+summary.trash+'</strong>Trash items</div></div><h2>Review possible outcomes</h2><div class="actions">'+btn('Invalid archive','invalid','danger')+btn('Verified archive','verified','primary')+btn('Reset','resetBackup')+'</div>'+(backup==='invalid'?'<div class="card" role="status"><h3>This archive could not be verified</h3><p>Your existing journal must remain unchanged. Do not apply this archive.</p></div>':backup==='verified'?'<div class="card" role="status"><h3>Verified archive (simulation)</h3><p>In production, inspect verified journal and media counts, stage the restore and confirm before applying.</p>'+btn('Review final confirmation','confirmBackup')+'</div>':'')+'<div class="soft">Simulated success is not evidence of a backup engine. A verified restore still needs Stage 4 engineering and fault tests.</div>','Backup review')}
function render(){document.body.dataset.theme=dark?'dark':'light';root.innerHTML=route==='journals'?journalsPage():route==='journal'?detailPage():route==='reader'?readerPage():route==='create'||route==='rename'?formPage():route==='archives'?archivesPage():route==='trash'?trashPage():backupPage();if(dialog){root.insertAdjacentHTML('beforeend','<div class="modal-back"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><span class="eyebrow">'+esc(dialog.category)+'</span><h2 id="modalTitle">'+esc(dialog.title)+'</h2><p>'+esc(dialog.message)+'</p><div class="actions">'+btn('Cancel','cancelModal')+btn(dialog.confirmText,'confirmModal','danger')+'</div></section></div>');root.querySelector('[data-action="cancelModal"]')?.focus()}if(route==='create'||route==='rename')root.querySelector('#journalName')?.focus()}
function move(routeName){route=routeName;render();if(typeof window!=='undefined')window.scrollTo?.(0,0)}
function confirmBox(data){dialog={...data,returnAction:document.activeElement?.dataset?.action||''};render()}
function dismiss(){const r=dialog?.returnAction;dialog=null;render();if(r)root.querySelector('[data-action="'+r+'"]')?.focus()}
function restore(id){const t=trash.find(t=>t.id===id);if(!t)return;if(t.kind==='entry'){const e=entries.find(e=>e.id===t.eid);if(e){e.trashed=false;if(!journal(e.jid))e.jid=journals[0]?.id||'j1'}}else{journals.push({...t.snapshot});entries.filter(e=>t.eids.includes(e.id)).forEach(e=>e.trashed=false)}trash.splice(trash.indexOf(t),1);move('trash')}
function apply(){if(!dialog)return;const action=dialog.action;dialog=null;
if(action==='deleteEntry'){const e=entries.find(e=>e.id===selectedEntry);if(e&&!e.trashed){e.trashed=true;trash.push({id:'t'+e.id,kind:'entry',eid:e.id,jid:e.jid,name:e.title})}route='trash'}
else if(action==='deleteJournal'){const j=journal(selectedJournal);if(j){const eids=entries.filter(e=>e.jid===j.id&&!e.trashed).map(e=>e.id);entries.filter(e=>eids.includes(e.id)).forEach(e=>e.trashed=true);trash.push({id:'t'+j.id,kind:'journal',name:j.name,snapshot:{...j},eids});journals.splice(journals.indexOf(j),1)}route='trash'}
else if(action.startsWith('purge:')){const id=action.slice(6),idx=trash.findIndex(t=>t.id===id);if(idx>=0){const t=trash.splice(idx,1)[0];const ids=t.kind==='entry'?[t.eid]:t.eids;for(const eid of ids){const pos=entries.findIndex(e=>e.id===eid);if(pos>=0)entries.splice(pos,1)}}route='trash'}
else if(action==='confirmBackup'){route='backup'}
render()}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;const act=b.dataset.action||'';
if(dialog&&act!=='cancelModal'&&act!=='confirmModal')return;
if(b.dataset.route){move(b.dataset.route);return}
if(act==='theme'){dark=!dark;render();return}
if(act==='create'){move('create');return}
if(act==='cancel'){move(route==='rename'?'journal':'journals');return}
if(act==='archives'){move('archives');return}
if(act==='journals'){move('journals');return}
if(act.startsWith('open:')){selectedJournal=act.slice(5);move('journal');return}
if(act.startsWith('read:')){selectedEntry=act.slice(5);move('reader');return}
if(act==='rename'){move('rename');return}
if(act==='archive'){const j=journal(selectedJournal);if(j){j.archived=!j.archived;move('journal')}return}
if(act==='deleteEntry'){const e=entries.find(x=>x.id===selectedEntry);confirmBox({category:'Move to Trash',title:'Delete this entry?',message:'“'+e.title+'” will move to Trash and can be restored.',confirmText:'Move to Trash',action:'deleteEntry'});return}
if(act==='deleteJournal'){const j=journal(selectedJournal);const n=count(j.id);confirmBox({category:'Move to Trash',title:'Delete '+j.name+'?',message:'This will move the journal and '+n+' '+(n===1?'entry':'entries')+' to Trash. They remain recoverable.',confirmText:'Move journal to Trash',action:'deleteJournal'});return}
if(act.startsWith('restore:')){restore(act.slice(8));return}
if(act.startsWith('purge:')){const t=trash.find(t=>t.id===act.slice(6));if(t)confirmBox({category:'Permanent deletion',title:'Permanently delete '+t.name+'?',message:'This demo item cannot be restored from Trash afterward. Real backups might still contain copies.',confirmText:'Delete permanently',action:act});return}
if(act==='cancelModal'){dismiss();return}
if(act==='confirmModal'){apply();return}
if(act==='invalid'){backup='invalid';render();return}
if(act==='verified'){backup='verified';render();return}
if(act==='resetBackup'){backup='none';render();return}
if(act==='confirmBackup'){confirmBox({category:'Restore confirmation',title:'Apply a verified archive?',message:'In production, restoration must be staged and checked before applying. This simulation changes nothing.',confirmText:'Acknowledge simulation',action:'confirmBackup'})}
});
root.addEventListener('submit',event=>{if(event.target.id!=='journalForm')return;event.preventDefault();
const name=root.querySelector('#journalName').value.trim(),error=root.querySelector('#nameError');
if(!name){error.hidden=false;error.textContent='Enter a journal name.';return}
if(name.length>48){error.hidden=false;error.textContent='Name must be 48 characters or fewer.';return}
if(journals.some(j=>j.name.toLocaleLowerCase()===name.toLocaleLowerCase()&&(route==='create'||j.id!==selectedJournal))){error.hidden=false;error.textContent='This journal name is already in use.';return}
if(route==='create'){const j={id:'j'+nextJ++,name,archived:false};journals.push(j);selectedJournal=j.id}
else{const j=journal(selectedJournal);if(j)j.name=name}
move('journal')
});
document.addEventListener('keydown',event=>{if(!dialog)return;if(event.key==='Escape'){event.preventDefault();dismiss();return}if(event.key==='Tab'){event.preventDefault();const buttons=[...root.querySelectorAll('.modal button')];const idx=buttons.indexOf(document.activeElement);buttons[(idx+(event.shiftKey?-1:1)+buttons.length)%buttons.length]?.focus()}});
render();
})();
</script></body></html>
