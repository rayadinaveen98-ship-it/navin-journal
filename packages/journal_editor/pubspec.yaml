name: navin_journal_editor
description: Fictional-data-only editor adapter and autosave bridge to encrypted full journal core
publish_to: none
version: 0.1.0
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  navin_journal_core:
    path: ../journal_core
  navin_journal_autosave_spike:
    path: ../../spikes/autosave_coordinator
  navin_journal_encrypted_spike:
    path: ../../spikes/encrypted_store
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
