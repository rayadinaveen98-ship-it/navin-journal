name: navin_journal_core
description: Encrypted whole-journal engine foundation, currently fictional test data only.
publish_to: none
version: 0.1.0
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  sqlite3: 3.9.1
  cryptography: 2.9.0
  navin_journal_encrypted_spike:
    path: ../../spikes/encrypted_store
  navin_journal_recovery_archive_spike:
    path: ../../spikes/recovery_archive
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
